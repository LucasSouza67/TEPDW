<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>TecStore</title>
</head>
<body>
    <main class="contanier mt-5">
        <h1 class="text-center mb-5">TecStore</h1>
        <p class="text-center mb-5">Tecnologia para todos</p>
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Noebook Pro</h5>
                        <p class="card-text">Notebook ideal para estudos e programação</p>
                        <p class="fw-bold"><R1>R$ 6.500,00</R1></p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Noebook Pro</h5>
                        <p class="card-text">Notebook ideal para estudos e programação</p>
                        <p class="fw-bold"><R1>R$ 6.500,00</R1></p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Noebook Pro</h5>
                        <p class="card-text">Notebook ideal para estudos e programação</p>
                        <p class="fw-bold"><R1> R$ 6.500,00</R1></p>
                        <button class="btn btn-primary">Comprar</button>
                    </div>
                </div>
            </div>
            <section class="mt-5">
                <h2 class="text-center mb-4">Entre em contato</h2>
                <form action="">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="mb-3">E-mail</label>
                        <input type="text" class="form-control" id="email">
                    </div>
                    <div class="mb-3">
                        <label for="mensagem" class="form-label">Mensagem</label>
                        <textarea id="mensagem" class="form-control" rowns="4"></textarea>
                    </div>
                    <button class="btn btn-primary">Enviar</button>
                </form>
            </section>
        </div>
    </main>
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>
</html>
