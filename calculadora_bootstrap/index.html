<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Calculadora</title>
</head>
<body class="bg-dark">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg" style="width: 350px;">
            <div class="card-header text-center bg-dark text-white">
                <h3 class="mb-0">Calculadora</h3>
            </div>
            <div class="card-body">
                <input
                    type="text"
                    id="display"
                    class="form-control form-control-lg text-end mb-3"
                    value="0"
                    readonly
                >
            </div>
            <div class="row g-2">
                    <div class="col-6">
                        <button class="btn btn-danger w-100" onclick="limpar()">
                            C
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-secondary w-100" onclick="adicionar('%')">
                            %
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning w-100" onclick="adicionar('/')">
                            ÷
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('7')">
                            7
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('8')">
                            8
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('9')">
                            9
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning w-100" onclick="adicionar('x')">
                            x
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('4')">
                            4
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('5')">
                            5
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('6')">
                            6
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning w-100" onclick="adicionar('-')">
                             −
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('1')">
                            1
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('2')">
                            2
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('3')">
                            3
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-warning w-100" onclick="adicionar('+')">
                            +
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-light border w-100" onclick="adicionar('0')">
                            0
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-light border w-100" onclick="adicionar('.')">
                            .
                        </button>
                    </div>
                    <div class="col-3">
                        <button class="btn btn-success border w-100" onclick="adicionar('=')">
                            =
                        </button>
                    </div>
            <div class="card-footer text-center text-muted">
                Desenvolvido com Bootstrap
            </div>
        </div>
    </div>
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
</body>
</html>
